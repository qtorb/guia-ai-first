<!-- El torb: el viento del norte del Pirineo que, con nieve, levanta una
     ventisca que borra las referencias. Bonito de lejos, peligroso dentro.
     De ahí sale «qtorb» — «qué torb» — y es mejor metáfora del trabajo con IA
     que la ola o el rayo: lo que pasa no es que te arrase, es que dentro
     dejas de ver el paisaje entero.

     Cuatro rachas desiguales, y el punto que la ventisca casi tapa: la
     referencia que el método existe para no perder. El punto es además el
     mismo de la tira de pasos de las hojas.

     Sustituye a un rayo violeta que venía de una plantilla y no significaba
     nada. Colores: los del sitio en modo oscuro — tinta #0E1526, papel
     #FCF9F6, y el acento de IA-Lab #FF9C93 (9,04:1 sobre la tinta).

     Las rachas flojas van algo más opacas de lo que pedía el dibujo grande:
     a 32 px, que es donde de verdad vive un favicon, por debajo de 0,35 se
     desvanecen y quedan tres rachas y media. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <rect width="96" height="96" fill="#0E1526"/>
  <circle cx="59.5" cy="48" r="10.1" fill="#FF9C93"/>
  <g stroke="#FCF9F6" stroke-width="6.9" stroke-linecap="round" fill="none">
    <line x1="15.4" y1="28.8" x2="59.5" y2="15.5" opacity=".44"/>
    <line x1="10.6" y1="44.2" x2="74.9" y2="24.9" opacity=".92"/>
    <line x1="19.2" y1="61.4" x2="67.2" y2="47.0" opacity=".58"/>
    <line x1="13.4" y1="76.8" x2="49.9" y2="65.8" opacity=".36"/>
  </g>
</svg>
